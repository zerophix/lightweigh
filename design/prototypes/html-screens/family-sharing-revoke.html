
<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>撤销数据共享 - 轻刻健康</title>
<style>
:root{--g:#21a675;--d:#147d58;--bg:#f5f8f5;--t:#26362d;--m:#89948c;--line:#edf1ed;--red:#bd5b55}*{box-sizing:border-box}body{margin:0;background:#eaf0eb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--t)}button{font:inherit;cursor:pointer}.app{max-width:430px;min-height:100vh;margin:auto;background:var(--bg);padding:0 20px 32px}.nav{height:58px;display:flex;align-items:center;gap:18px}.nav button{border:0;background:none;font-size:25px}.nav b{font-size:17px}.hero{padding:20px 0 22px}.hero h1{font-size:24px;margin:0 0 8px}.hero p{font-size:13px;line-height:1.8;color:var(--m);margin:0}.card{background:white;border-radius:18px;padding:18px;margin-bottom:13px}.person{display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;border-radius:16px;background:#f9e9df;display:grid;place-items:center;font-size:22px}.person strong{font-size:14px}.person p{font-size:11px;color:var(--m);margin:6px 0 0}.title{font-size:15px;font-weight:700;margin-bottom:12px}.option{display:flex;align-items:flex-start;gap:11px;padding:14px 0;border-bottom:1px solid var(--line)}.option:last-child{border:0}.option input{margin-top:4px;accent-color:var(--g)}.option strong{font-size:13px}.option p{font-size:11px;line-height:1.7;color:var(--m);margin:5px 0 0}.notice{padding:13px;background:#fff5e8;color:#966e36;border-radius:12px;font-size:12px;line-height:1.8}.rednote{padding:13px;background:#fff2f1;color:#a95b55;border-radius:12px;font-size:12px;line-height:1.8;margin-top:10px}.primary,.secondary,.danger{height:47px;width:100%;border-radius:13px;font-size:13px;font-weight:650}.primary{background:var(--g);border:0;color:white}.secondary{background:white;border:1px solid #dce8df;color:var(--d);margin-top:10px}.danger{background:white;border:1px solid #edcfcd;color:var(--red);margin-top:10px}.toast{display:none;background:#243b2e;color:white;border-radius:12px;padding:12px;font-size:12px;margin-bottom:12px}.modal{display:none;position:fixed;inset:0;background:#14231c77;align-items:flex-end;justify-content:center;padding:14px}.modal.show{display:flex}.sheet{background:white;border-radius:22px;padding:23px;width:min(100%,400px)}.sheet h2{font-size:19px;margin:0 0 10px}.sheet p{font-size:12px;line-height:1.8;color:#758178}.sheet button{margin-top:10px}.result{display:none;text-align:center;padding:35px 0}.result .mark{height:75px;width:75px;border-radius:25px;background:#e1f4e7;color:var(--d);display:grid;place-items:center;margin:0 auto 18px;font-size:34px}.result h2{font-size:22px}.result p{font-size:13px;line-height:1.8;color:var(--m)}
</style></head><body><main class="app">
<header class="nav"><button onclick="history.back()">‹</button><b>撤销数据共享</b></header>
<section id="mainContent">
<section class="hero"><h1>管理你的数据共享</h1><p>你可以停止共享某类健康数据，也可以撤销全部共享授权。撤销共享与移除家庭成员是不同操作。</p></section>
<div class="toast" id="toast" role="status"></div>
<section class="card"><div class="person"><div class="avatar">👩</div><div><strong>林女士</strong><p>家庭成员 · 当前授权为示例数据</p></div></div></section>
<section class="card"><div class="title">选择撤销范围</div>
<label class="option"><input type="radio" name="scope" value="selected" checked><span><strong>只撤销指定数据权限</strong><p>保留家庭关系，只停止所选数据类别的共享。</p></span></label>
<label class="option"><input type="radio" name="scope" value="all"><span><strong>撤销全部数据共享</strong><p>停止此成员通过当前授权获取所有已共享健康数据的后续访问。</p></span></label>
<div id="selectedOptions"><label class="option"><input type="checkbox" value="最新测量摘要" checked><span><strong>最新测量摘要</strong><p>最新测量指标及摘要信息。</p></span></label><label class="option"><input type="checkbox" value="历史测量记录"><span><strong>历史测量记录</strong><p>过往测量数据和详情。</p></span></label><label class="option"><input type="checkbox" value="行动计划进度"><span><strong>行动计划进度</strong><p>计划完成情况和阶段进度。</p></span></label></div></section>
<section class="card"><div class="title">撤销后的影响</div><div class="notice">正式产品应在服务端确认撤销生效，并阻止后续未授权访问。已经合法导出或被接收方另行保存的数据，可能无法通过撤销操作自动删除。</div><div class="rednote">本页面不会修改真实权限、删除数据或通知家庭成员。正式实现应记录操作主体、时间、范围及结果。</div></section>
<button class="primary" onclick="confirmRevoke()">继续撤销</button><button class="secondary" onclick="location.href='family-member-detail.html'">返回成员详情</button>
</section>
<section class="result" id="result"><div class="mark">✓</div><h2 id="resultTitle">撤销流程已完成</h2><p id="resultText"></p><button class="primary" onclick="location.href='family-member-detail.html'">返回成员详情</button><button class="secondary" onclick="location.reload()">再次演示</button></section>
</main>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><section class="sheet"><h2>确认撤销数据共享？</h2><p id="confirmText">确认后将停止所选数据类别的共享。正式产品应在服务端执行并反馈实际结果。</p><button class="danger" style="height:46px;width:100%;border-radius:13px;border:1px solid #edcfcd;background:#fff;color:#bd5b55;font-weight:650" onclick="doRevoke()">确认撤销（演示）</button><button class="secondary" style="height:46px;width:100%;border-radius:13px;background:white;color:#147d58;border:1px solid #dce8df" onclick="closeModal()">暂不撤销</button></section></div>
<script>
const $=id=>document.getElementById(id);let selectedScope='selected';function toast(s){$('toast').textContent=s;$('toast').style.display='block'}
document.querySelectorAll('input[name="scope"]').forEach(r=>r.addEventListener('change',()=>{selectedScope=r.value;$('selectedOptions').style.display=selectedScope==='all'?'none':'block'}));
function confirmRevoke(){let items=[...document.querySelectorAll('#selectedOptions input:checked')].map(x=>x.value);if(selectedScope==='selected'&&!items.length){toast('请至少选择一项需要撤销的数据权限。');return}let msg=selectedScope==='all'?'撤销全部健康数据共享授权':'撤销以下数据权限：'+items.join('、');$('confirmText').textContent='你选择了：'+msg+'。此页面只模拟确认流程，不会更改真实授权。';$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function doRevoke(){closeModal();const all=selectedScope==='all';const items=[...document.querySelectorAll('#selectedOptions input:checked')].map(x=>x.value);$('mainContent').style.display='none';$('result').style.display='block';$('resultTitle').textContent=all?'全部共享撤销演示完成':'指定权限撤销演示完成';$('resultText').textContent=all?'当前页面模拟了撤销全部共享授权。真实家庭关系及服务端权限未改变。':'当前页面模拟撤销：'+items.join('、')+'。真实服务端权限未改变。';window.scrollTo(0,0)}
</script></body></html>
