
<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>添加家庭成员 - 轻刻健康</title>
<style>
:root{--g:#21a675;--d:#147d58;--bg:#f5f8f5;--t:#26362d;--m:#89948c;--line:#edf1ed;--red:#c65e58}*{box-sizing:border-box}body{margin:0;background:#eaf0eb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--t)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:430px;min-height:100vh;margin:auto;background:var(--bg);padding:0 20px 34px}.nav{height:58px;display:flex;align-items:center;gap:18px}.back{font-size:26px;border:0;background:none}.nav b{font-size:17px}.hero{padding:17px 0 20px}.hero h1{font-size:24px;margin:0 0 8px}.hero p{font-size:13px;color:var(--m);line-height:1.7;margin:0}.stepbar{display:flex;align-items:center;gap:8px;margin:17px 0 21px}.step{height:5px;border-radius:10px;background:#dfe8e0;flex:1}.step.active{background:var(--g)}.step-label{font-size:11px;color:var(--m);margin-left:3px}.card{background:white;border-radius:18px;padding:18px;margin-bottom:13px}.title{font-size:15px;font-weight:700;margin-bottom:15px}.label{font-size:12px;color:#6e7b72;display:block;margin-bottom:8px}.input,.select{width:100%;height:47px;border:1px solid #dce5dd;border-radius:12px;padding:0 12px;background:white;color:var(--t);outline-color:var(--g);font-size:14px}.field{margin-bottom:16px}.field:last-child{margin-bottom:0}.method{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:17px}.method label{border:1px solid #e0e8e1;border-radius:13px;padding:13px 10px;display:flex;gap:9px;align-items:center;font-size:13px}.method label.active{border-color:#8fd1a8;background:#f0f9f2;color:var(--d)}input[type=radio],input[type=checkbox]{accent-color:var(--g)}.share{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}.share:last-child{border:0;padding-bottom:0}.share input{margin-top:3px}.share strong{font-size:13px}.share p{font-size:11px;color:var(--m);line-height:1.7;margin:5px 0 0}.tag{font-size:10px;background:#eaf6ed;color:var(--d);padding:4px 7px;border-radius:7px;margin-left:5px}.note{font-size:11px;color:#738078;line-height:1.8;background:#f4f8f4;border-radius:12px;padding:12px;margin-top:13px}.primary,.secondary{height:48px;width:100%;border-radius:13px;font-size:14px;font-weight:650}.primary{border:0;background:var(--g);color:white}.secondary{margin-top:10px;border:1px solid #dce8df;background:white;color:var(--d)}.error{display:none;color:var(--red);font-size:12px;margin:0 0 12px;line-height:1.6}.toast{display:none;background:#243b2e;color:white;padding:12px;border-radius:12px;font-size:12px;margin-bottom:12px}.result{display:none;text-align:center;padding:30px 5px}.result-icon{width:76px;height:76px;border-radius:25px;background:#e1f4e7;color:var(--d);display:grid;place-items:center;font-size:35px;margin:0 auto 18px}.result h2{font-size:22px;margin:0 0 10px}.result p{font-size:13px;color:var(--m);line-height:1.8;margin:0 0 22px}
</style></head><body><main class="app">
<header class="nav"><button class="back" onclick="history.back()">‹</button><b>添加家庭成员</b></header>
<section class="hero" id="intro"><h1>邀请家人一起加入</h1><p>填写邀请信息，并选择你希望共享的数据范围。<br>家庭关系建立前，应由对方明确接受邀请。</p><div class="stepbar"><span class="step active"></span><span class="step"></span><span class="step-label">填写邀请信息</span></div></section>
<div id="toast" class="toast" role="status"></div>
<form id="inviteForm" onsubmit="submitInvite(event)">
<section class="card"><div class="title">邀请信息</div><div class="method"><label class="active" id="phoneMethod"><input type="radio" name="method" value="phone" checked onchange="switchMethod()"> 手机号邀请</label><label id="codeMethod"><input type="radio" name="method" value="code" onchange="switchMethod()"> 邀请码邀请</label></div>
<div class="field" id="phoneField"><label class="label" for="phone">对方手机号</label><input class="input" id="phone" inputmode="tel" autocomplete="tel" placeholder="请输入对方手机号" maxlength="11"><p class="note">请确认号码属于你要邀请的家庭成员。正式产品应通过服务端发送邀请，并对手机号进行脱敏展示。</p></div>
<div class="field" id="codeField" style="display:none"><label class="label" for="inviteCode">邀请码</label><input class="input" id="inviteCode" maxlength="12" placeholder="输入对方提供的邀请码"></div>
<div class="field"><label class="label" for="nickname">成员备注名称（选填）</label><input class="input" id="nickname" maxlength="20" placeholder="例如：爸爸、妈妈"></div>
<div class="field"><label class="label" for="relation">与我的关系</label><select class="select" id="relation"><option value="配偶">配偶</option><option value="父母">父母</option><option value="子女">子女</option><option value="兄弟姐妹">兄弟姐妹</option><option value="其他家人">其他家人</option><option value="其他">其他</option></select></div></section>
<section class="card"><div class="title">数据共享范围</div><label class="share"><input type="checkbox" id="shareLatest"><span><strong>共享最新测量摘要</strong><p>允许查看已授权成员的最新测量概览，不默认开放全部历史记录。</p></span></label><label class="share"><input type="checkbox" id="shareHistory"><span><strong>共享历史测量记录</strong><span class="tag">需明确授权</span><p>允许查看历史体重及体成分记录。可在正式产品中进一步限制时间范围。</p></span></label><label class="share"><input type="checkbox" id="sharePlan"><span><strong>共享行动计划进度</strong><p>允许查看已授权的计划完成情况，不包含私人对话内容。</p></span></label><div class="note">权限应遵循最小必要原则。对方接受邀请后，还应明确确认数据共享授权；撤销共享后，应停止后续访问。</div></section>
<p id="error" class="error" role="alert"></p><button type="submit" class="primary" id="submitBtn">生成邀请（演示）</button><button type="button" class="secondary" onclick="location.href='family-list.html'">取消</button>
</form>
<section class="result" id="result"><div class="result-icon">✓</div><h2>邀请演示已生成</h2><p id="resultDesc">已完成前端表单校验。<br>尚未发送短信或创建真实邀请。</p><div class="card" style="text-align:left"><div class="label">本次邀请信息</div><div id="resultInfo" style="font-size:13px;line-height:2"></div></div><button class="primary" onclick="location.href='family-list.html'">返回家庭成员</button><button class="secondary" onclick="resetForm()">继续邀请其他成员</button></section>
<p style="font-size:11px;color:#9aa59d;line-height:1.8;text-align:center;margin-top:15px">原型限制：不会验证账号是否存在、发送短信、创建邀请码或保存授权关系。正式实现需接入服务端邀请机制、身份验证、过期处理和审计记录。</p>
</main>
<script>
const $=id=>document.getElementById(id);
function switchMethod(){const code=document.querySelector('input[name="method"]:checked').value==='code';$('phoneField').style.display=code?'none':'block';$('codeField').style.display=code?'block':'none';$('phoneMethod').classList.toggle('active',!code);$('codeMethod').classList.toggle('active',code);$('error').style.display='none'}
function submitInvite(e){e.preventDefault();const code=document.querySelector('input[name="method"]:checked').value==='code';const phone=$('phone').value.trim();const inviteCode=$('inviteCode').value.trim();$('error').style.display='none';if(!code&&!/^1\d{10}$/.test(phone)){showError('请输入有效的 11 位手机号。当前只进行格式校验，不会验证号码归属。');return}if(code&&!/^[A-Za-z0-9]{4,12}$/.test(inviteCode)){showError('请输入 4–12 位字母或数字组成的邀请码。');return}if(!$('shareLatest').checked&&!$('shareHistory').checked&&!$('sharePlan').checked){showError('请至少选择一项希望邀请对方共享的数据范围，或在正式产品中提供不共享数据的邀请路径。');return}const name=$('nickname').value.trim()||$('relation').value;$('resultInfo').innerHTML='成员备注：'+escapeHtml(name)+'<br>邀请方式：'+(code?'邀请码':'手机号邀请')+'<br>数据权限：'+[$('shareLatest').checked?'最新测量摘要':'',$('shareHistory').checked?'历史测量记录':'',$('sharePlan').checked?'行动计划进度':''].filter(Boolean).map(escapeHtml).join('、');$('intro').style.display='none';$('inviteForm').style.display='none';$('result').style.display='block';window.scrollTo(0,0)}
function showError(s){$('error').textContent=s;$('error').style.display='block'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function resetForm(){$('inviteForm').reset();$('intro').style.display='block';$('inviteForm').style.display='block';$('result').style.display='none';switchMethod();window.scrollTo(0,0)}
</script></body></html>
