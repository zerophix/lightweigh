
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重置密码 - 轻刻健康</title>
<style>
:root{--green:#21a675;--deep:#147d58;--text:#20332b;--muted:#7d8982;--line:#e5ece7;--bg:#f5f8f5;--red:#d95e5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
.app{max-width:430px;min-height:100vh;min-height:100dvh;margin:auto;background:white;padding:0 25px 28px;display:flex;flex-direction:column}
header{height:58px;display:flex;align-items:center}
header button{border:0;background:none;font-size:27px;cursor:pointer}
main{flex:1}
.icon{width:58px;height:58px;border-radius:19px;background:#e6f7ef;color:var(--green);display:grid;place-items:center;font-size:26px;margin:30px 0 22px}
h1{font-size:26px;margin:0 0 10px}
.subtitle{font-size:13px;line-height:1.8;color:var(--muted);margin:0 0 28px}
.field{margin-bottom:19px}
.label{display:block;font-size:12px;font-weight:600;margin-bottom:9px}
.input{height:49px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;padding:0 13px;gap:8px}
.input:focus-within{border-color:var(--green)}
.input input{width:100%;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:14px}
.input input::placeholder{color:#b1bbb5}
.show{border:0;background:none;color:var(--deep);font-size:12px;cursor:pointer}
.rules{padding:12px;background:#f6faf7;border-radius:11px;margin-top:9px}
.rules p{font-size:11px;color:var(--muted);margin:0 0 7px}
.rules p:last-child{margin:0}
.rules .ok{color:var(--deep)}
.rules .ok:before{content:"✓ "}
.rules p:not(.ok):before{content:"○ "}
.error{display:none;color:var(--red);font-size:11px;line-height:1.6;margin-top:7px}
.primary{width:100%;border:0;border-radius:13px;background:var(--green);color:white;padding:14px;font:inherit;font-size:15px;font-weight:650;cursor:pointer;margin-top:9px}
.message{display:none;background:#e6f7ef;color:var(--deep);padding:13px;border-radius:11px;font-size:12px;line-height:1.8;margin-top:14px}
.foot{text-align:center;font-size:10px;color:#a0aaa3;line-height:1.7;margin-top:26px}
</style>
</head>
<body>
<div class="app">
<header><button onclick="location.href='account-forgot-password.html'" aria-label="返回">‹</button></header>
<main>
<div class="icon">⌑</div>
<h1>设置新密码</h1>
<p class="subtitle">请创建一个安全的新密码。不要使用与其他网站相同的密码。</p>
<form id="form">
<div class="field">
<label class="label" for="password">新密码</label>
<div class="input"><input id="password" type="password" minlength="8" maxlength="64" autocomplete="new-password" placeholder="请输入新密码" required><button type="button" class="show" onclick="toggle('password',this)">显示</button></div>
<div class="rules">
<p id="r1">至少 8 位字符</p>
<p id="r2">包含字母和数字</p>
<p id="r3">不能与确认密码不同</p>
</div>
<div class="error" id="passError">请设置符合规则的密码。</div>
</div>
<div class="field">
<label class="label" for="confirm">确认新密码</label>
<div class="input"><input id="confirm" type="password" minlength="8" maxlength="64" autocomplete="new-password" placeholder="请再次输入新密码" required><button type="button" class="show" onclick="toggle('confirm',this)">显示</button></div>
<div class="error" id="confirmError">两次输入的密码不一致。</div>
</div>
<button class="primary" type="submit">确认重置</button>
</form>
<div class="message" id="message" role="status"></div>
</main>
<div class="foot">重置密码后，正式产品应根据安全策略处理现有登录会话。<br>当前页面不会修改真实账号密码。</div>
</div>
<script>
const pass=document.getElementById('password'),confirmInput=document.getElementById('confirm');
function toggle(id,button){
 const input=document.getElementById(id);
 input.type=input.type==='password'?'text':'password';
 button.textContent=input.type==='password'?'显示':'隐藏';
}
function update(){
 const v=pass.value;
 document.getElementById('r1').classList.toggle('ok',v.length>=8);
 document.getElementById('r2').classList.toggle('ok',/[A-Za-z]/.test(v)&&/\d/.test(v));
 document.getElementById('r3').classList.toggle('ok',v===confirmInput.value&&v.length>0);
}
pass.addEventListener('input',update);confirmInput.addEventListener('input',update);
document.getElementById('form').addEventListener('submit',event=>{
 event.preventDefault();
 const valid=pass.value.length>=8&&/[A-Za-z]/.test(pass.value)&&/\d/.test(pass.value);
 document.getElementById('passError').style.display=valid?'none':'block';
 document.getElementById('confirmError').style.display=pass.value===confirmInput.value?'none':'block';
 if(!valid||pass.value!==confirmInput.value)return;
 const message=document.getElementById('message');
 message.style.display='block';
 message.innerHTML='密码规则校验通过。真实身份验证与密码更新服务尚未接入。<br><br><button type="button" style="border:0;border-radius:9px;background:#21a675;color:white;padding:10px 14px;cursor:pointer" onclick="location.href=\'account-login.html\'">返回登录</button>';
});
</script>
</body>
</html>
