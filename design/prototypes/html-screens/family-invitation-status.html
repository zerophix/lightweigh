
<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邀请管理 - 轻刻健康</title>
<style>
:root{--g:#21a675;--d:#147d58;--bg:#f5f8f5;--t:#26362d;--m:#89948c;--line:#edf1ed}*{box-sizing:border-box}body{margin:0;background:#eaf0eb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--t)}button{font:inherit;cursor:pointer}.app{max-width:430px;min-height:100vh;margin:auto;background:var(--bg);padding:0 20px 30px}.nav{height:58px;display:flex;align-items:center;gap:18px}.nav button{border:0;background:none;font-size:25px}.nav b{font-size:17px}.hero{padding:17px 0 20px}.hero h1{font-size:24px;margin:0 0 8px}.hero p{font-size:13px;line-height:1.7;color:var(--m);margin:0}.card{background:white;border-radius:18px;padding:16px;margin-bottom:13px}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0 4px}.tab{white-space:nowrap;border:1px solid #e1e9e2;background:white;border-radius:20px;padding:8px 12px;font-size:12px;color:#7a867d}.tab.active{background:#e6f5eb;border-color:#b9e1c6;color:var(--d)}.invite{padding:15px 0;border-bottom:1px solid var(--line)}.invite:last-child{border:0}.top{display:flex;align-items:center;gap:11px}.avatar{width:43px;height:43px;border-radius:14px;background:#edf4ed;display:grid;place-items:center;font-size:20px}.info{flex:1;min-width:0}.info strong{font-size:13px;display:block}.info p{font-size:11px;color:var(--m);margin:5px 0 0}.badge{padding:5px 8px;border-radius:8px;font-size:10px;background:#fff3e2;color:#a8732c;white-space:nowrap}.badge.ok{background:#e7f6ec;color:var(--d)}.badge.gray{background:#f0f2f0;color:#7c867f}.detail{font-size:11px;color:var(--m);line-height:1.8;margin:11px 0}.actions{display:flex;gap:8px}.actions button{border:1px solid #dce8df;background:white;color:var(--d);padding:8px 12px;border-radius:10px;font-size:11px}.actions button.warn{color:#b65b55;border-color:#f0dddd}.empty{text-align:center;padding:35px 10px;color:var(--m);font-size:13px}.primary{height:47px;width:100%;border:0;border-radius:13px;background:var(--g);color:white;font-weight:650}.toast{display:none;background:#243b2e;color:white;border-radius:12px;padding:12px;font-size:12px;margin-bottom:12px}
</style></head><body><main class="app">
<header class="nav"><button onclick="history.back()">‹</button><b>邀请管理</b></header>
<section class="hero"><h1>家庭邀请</h1><p>查看邀请状态，并管理尚未完成的邀请。以下记录均为示例。</p></section>
<div class="toast" id="toast" role="status"></div>
<section class="card"><div class="tabs"><button class="tab active" onclick="filter('all',this)">全部</button><button class="tab" onclick="filter('pending',this)">待接受</button><button class="tab" onclick="filter('accepted',this)">已接受</button><button class="tab" onclick="filter('expired',this)">已过期</button><button class="tab" onclick="filter('revoked',this)">已撤回</button></div>
<div id="list">
<article class="invite" data-status="pending"><div class="top"><div class="avatar">👨</div><div class="info"><strong>张先生</strong><p>手机号邀请 · 138****1234</p></div><span class="badge">待接受</span></div><div class="detail">邀请时间：示例时间<br>有效期：示例规则 · 共享范围尚未生效</div><div class="actions"><button onclick="resend(this)">重新发送</button><button class="warn" onclick="revoke(this)">撤回邀请</button></div></article>
<article class="invite" data-status="accepted"><div class="top"><div class="avatar">👩</div><div class="info"><strong>林女士</strong><p>家庭邀请 · 已完成确认</p></div><span class="badge ok">已接受</span></div><div class="detail">当前关系：已加入家庭<br>数据访问范围以已生效授权为准。</div><div class="actions"><button onclick="location.href='family-member-detail.html'">查看成员</button></div></article>
<article class="invite" data-status="expired"><div class="top"><div class="avatar">👤</div><div class="info"><strong>王女士</strong><p>邀请码邀请 · INV-DEMO</p></div><span class="badge gray">已过期</span></div><div class="detail">邀请已失效（演示状态）。正式产品应重新生成安全的新邀请凭证。</div><div class="actions"><button onclick="renew(this)">重新邀请</button></div></article>
</div><div id="empty" class="empty" style="display:none">该分类下暂无邀请记录</div></section>
<button class="primary" onclick="location.href='family-add-member.html'">＋ 发起新邀请</button>
<p style="font-size:11px;color:#9aa59d;line-height:1.8;text-align:center;margin-top:15px">原型不会发送短信、创建邀请码或更新服务端邀请状态。</p>
</main><script>
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block'}
function filter(status,btn){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');let n=0;document.querySelectorAll('.invite').forEach(x=>{let show=status==='all'||x.dataset.status===status;x.style.display=show?'block':'none';if(show)n++});document.getElementById('empty').style.display=n?'none':'block'}
function resend(btn){toast('已模拟重新发送邀请；未调用短信服务。')}
function revoke(btn){if(!confirm('确认模拟撤回这条邀请？'))return;let card=btn.closest('.invite');card.dataset.status='revoked';card.querySelector('.badge').textContent='已撤回';card.querySelector('.badge').className='badge gray';card.querySelector('.detail').textContent='该邀请已在当前页面切换为撤回状态，服务端状态未改变。';card.querySelector('.actions').innerHTML='';toast('邀请撤回演示完成。')}
function renew(btn){toast('已模拟重新邀请。正式版本应生成新的、有限期且不可预测的邀请凭证。')}
</script></body></html>
