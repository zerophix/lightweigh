
<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据权限 - 轻刻健康</title>
<style>
:root{--g:#21a675;--d:#147d58;--bg:#f5f8f5;--t:#26362d;--m:#89948c;--line:#edf1ed}*{box-sizing:border-box}body{margin:0;background:#eaf0eb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--t)}button{font:inherit;cursor:pointer}.app{max-width:430px;min-height:100vh;margin:auto;background:var(--bg);padding:0 20px 32px}.nav{height:58px;display:flex;align-items:center;gap:18px}.nav button{font-size:25px;border:0;background:none}.nav b{font-size:17px}.hero{padding:18px 0 21px}.hero h1{font-size:24px;margin:0 0 8px}.hero p{font-size:13px;line-height:1.7;color:var(--m);margin:0}.person{display:flex;align-items:center;gap:11px;background:white;padding:14px;border-radius:15px;margin-top:17px}.avatar{width:43px;height:43px;border-radius:14px;background:#f9e9df;display:grid;place-items:center;font-size:22px}.person strong{font-size:13px}.person p{margin:5px 0 0;font-size:11px;color:var(--m)}.card{background:white;border-radius:18px;padding:18px;margin-bottom:13px}.title{font-size:15px;font-weight:700}.sub{font-size:11px;color:var(--m);line-height:1.7;margin:6px 0 13px}.item{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.ico{width:39px;height:39px;border-radius:12px;background:#edf7f0;color:var(--d);display:grid;place-items:center;font-size:17px;flex-shrink:0}.main{flex:1}.main strong{font-size:13px}.main p{font-size:11px;line-height:1.6;color:var(--m);margin:5px 0 0}.toggle{width:43px;height:25px;border:0;border-radius:20px;background:#dce4dd;position:relative;flex-shrink:0}.toggle:after{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;border-radius:50%;background:white;transition:.2s}.toggle.on{background:var(--g)}.toggle.on:after{left:21px}.note{background:#edf7f0;border-radius:12px;padding:12px;font-size:11px;color:#52745c;line-height:1.8}.primary,.secondary{height:47px;width:100%;border-radius:13px;font-size:13px;font-weight:650}.primary{background:var(--g);border:0;color:white}.secondary{background:white;border:1px solid #dce8df;color:var(--d);margin-top:10px}.toast{display:none;background:#243b2e;color:white;border-radius:12px;padding:12px;font-size:12px;margin-bottom:12px}
</style></head><body><main class="app">
<header class="nav"><button onclick="history.back()">‹</button><b>数据权限设置</b></header>
<section class="hero"><h1>你想与家人共享什么？</h1><p>只开放需要共享的数据。你可以随时修改权限，变更应在正式服务端确认后生效。</p><div class="person"><div class="avatar">👩</div><div><strong>林女士</strong><p>普通家庭成员 · 权限设置演示</p></div></div></section>
<div id="toast" class="toast" role="status"></div>
<section class="card"><div class="title">健康数据</div><div class="sub">选择允许对方查看的数据类型</div>
<div class="item"><div class="ico">◉</div><div class="main"><strong>最新测量摘要</strong><p>最新体重及已生成的身体指标摘要</p></div><button class="toggle on" aria-label="最新测量摘要权限" aria-pressed="true" onclick="flip(this)"></button></div>
<div class="item"><div class="ico">▤</div><div class="main"><strong>历史测量记录</strong><p>过去的测量记录与单次测量详情</p></div><button class="toggle" aria-label="历史测量记录权限" aria-pressed="false" onclick="flip(this)"></button></div>
<div class="item"><div class="ico">↗</div><div class="main"><strong>指标趋势</strong><p>体重、体脂率等已授权指标的趋势图</p></div><button class="toggle" aria-label="指标趋势权限" aria-pressed="false" onclick="flip(this)"></button></div>
<div class="item"><div class="ico">✓</div><div class="main"><strong>行动计划进度</strong><p>计划完成情况与阶段性进度</p></div><button class="toggle on" aria-label="行动计划权限" aria-pressed="true" onclick="flip(this)"></button></div></section>
<section class="card"><div class="title" style="margin-bottom:12px">授权原则</div><div class="note">本页面的开关只改变当前界面状态。正式产品应记录授权主体、授权范围、授权时间及撤销时间，并由服务端强制执行数据访问控制。</div></section>
<button class="primary" onclick="save()">保存权限设置</button><button class="secondary" onclick="reset()">恢复进入页面时的设置</button>
<p style="text-align:center;color:#9aa59d;font-size:11px;line-height:1.7;margin-top:14px">未实现真实家庭授权、服务端保存及跨设备权限同步。</p>
</main><script>
const initial=[true,false,false,true];const toggles=[...document.querySelectorAll('.toggle')];function flip(b){b.classList.toggle('on');b.setAttribute('aria-pressed',b.classList.contains('on')?'true':'false')}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block'}
function save(){const enabled=toggles.map(b=>b.classList.contains('on'));toast('权限设置演示已更新：'+enabled.filter(Boolean).length+' 项开启。尚未保存到服务端。')}
function reset(){toggles.forEach((b,i)=>{b.classList.toggle('on',initial[i]);b.setAttribute('aria-pressed',initial[i]?'true':'false')});toast('已恢复本页初始演示权限。')}
</script></body></html>
