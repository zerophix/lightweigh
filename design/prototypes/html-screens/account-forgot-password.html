
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忘记密码 - 轻刻健康</title>
<style>
:root{--green:#21a675;--deep:#147d58;--bg:#f5f8f5;--text:#20332b;--muted:#7d8982;--line:#e5ece7;--red:#d95e5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
.app{max-width:430px;min-height:100vh;min-height:100dvh;margin:auto;background:#fff;padding:0 25px 28px;display:flex;flex-direction:column}
header{height:58px;display:flex;align-items:center}
header button{border:0;background:none;font-size:27px;cursor:pointer;padding:0 8px 0 0}
main{flex:1}
.icon{width:58px;height:58px;border-radius:19px;background:#e6f7ef;color:var(--green);display:grid;place-items:center;font-size:28px;margin:31px 0 22px}
h1{font-size:26px;margin:0 0 10px}
.subtitle{font-size:13px;line-height:1.8;color:var(--muted);margin:0 0 29px}
.field{margin-bottom:19px}
.label{display:block;font-size:12px;font-weight:600;margin-bottom:9px}
.input{height:49px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 13px}
.input:focus-within{border-color:var(--green)}
.prefix{font-size:13px;color:#53665b}
input{min-width:0;width:100%;border:0;outline:0;font:inherit;font-size:14px;background:transparent;color:var(--text)}
input::placeholder{color:#b1bbb5}
.error{display:none;color:var(--red);font-size:11px;line-height:1.6;margin-top:7px}
.hint{font-size:11px;line-height:1.8;color:var(--muted);margin-top:8px}
.primary{width:100%;border:0;border-radius:13px;background:var(--green);color:#fff;padding:14px;font:inherit;font-size:15px;font-weight:650;cursor:pointer;margin-top:10px}
.message{display:none;background:#e6f7ef;color:var(--deep);padding:13px;border-radius:11px;font-size:12px;line-height:1.8;margin-top:14px}
.back-login{text-align:center;margin-top:24px;font-size:12px;color:var(--muted)}
a{color:var(--deep);text-decoration:none}
.foot{text-align:center;font-size:10px;color:#a0aaa3;line-height:1.7;margin-top:26px}
</style>
</head>
<body>
<div class="app">
<header><button onclick="location.href='account-login.html'" aria-label="返回登录">‹</button></header>
<main>
<div class="icon">⌑</div>
<h1>忘记密码？</h1>
<p class="subtitle">输入注册时使用的手机号，我们将通过身份验证帮助你重设密码。</p>
<form id="form">
<div class="field">
<label class="label" for="phone">注册手机号</label>
<div class="input"><span class="prefix">+86</span><input id="phone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="请输入 11 位手机号" required></div>
<div class="error" id="phoneError">请输入有效的中国大陆手机号。</div>
<p class="hint">为保护账号安全，正式产品应先验证手机号归属，再允许重置密码。</p>
</div>
<button class="primary" type="submit">验证手机号</button>
</form>
<div class="message" id="message" role="status"></div>
<div class="back-login">想起密码了？ <a href="account-login.html">返回登录</a></div>
</main>
<div class="foot">请勿将验证码或密码告知他人。<br>当前为交互原型，不会查询账号或发送短信。</div>
</div>
<script>
document.getElementById('form').addEventListener('submit',event=>{
 event.preventDefault();
 const phone=document.getElementById('phone').value.trim();
 const error=document.getElementById('phoneError');
 const message=document.getElementById('message');
 if(!/^1[3-9]\d{9}$/.test(phone)){
  error.style.display='block';message.style.display='none';return;
 }
 error.style.display='none';
 message.style.display='block';
 message.innerHTML='手机号格式校验通过。下一步将进入验证码验证原型。<br><br><button type="button" style="border:0;border-radius:9px;background:#21a675;color:white;padding:10px 14px;cursor:pointer" onclick="location.href=\'account-verification.html?phone='+encodeURIComponent(phone)+'&scene=reset\'">继续验证</button>';
});
</script>
</body>
</html>
