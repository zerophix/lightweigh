
<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭成员 - 轻刻健康</title>
<style>
:root{--g:#21a675;--d:#147d58;--bg:#f5f8f5;--t:#26362d;--m:#89948c;--line:#edf1ed}*{box-sizing:border-box}body{margin:0;background:#eaf0eb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--t)}button,input{font:inherit}button{cursor:pointer}.app{max-width:430px;min-height:100vh;margin:auto;background:var(--bg);padding:0 20px 30px}.nav{height:58px;display:flex;align-items:center;justify-content:space-between}.nav b{font-size:17px}.nav button{border:0;background:none;color:var(--d);font-size:13px}.hero{padding:15px 0 20px}.hero h1{font-size:25px;margin:0 0 8px}.hero p{font-size:13px;color:var(--m);line-height:1.7;margin:0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.summary div{background:white;border-radius:15px;padding:14px 8px;text-align:center}.summary strong{display:block;font-size:21px;color:var(--d)}.summary span{font-size:11px;color:var(--m);display:block;margin-top:6px}.card{background:white;border-radius:18px;padding:16px;margin-bottom:13px}.row{display:flex;justify-content:space-between;align-items:center}.title{font-size:15px;font-weight:700}.count{font-size:11px;color:var(--m)}.tabs{display:flex;gap:8px;margin:14px 0}.tab{padding:8px 12px;border-radius:20px;border:1px solid #e4ebe5;background:white;color:#778279;font-size:12px}.tab.active{background:#e4f5e9;border-color:#bfe4cc;color:var(--d)}.member{display:flex;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid var(--line)}.member:last-child{border:0}.avatar{height:45px;width:45px;border-radius:16px;display:grid;place-items:center;font-size:20px;background:#e2f4e8;flex-shrink:0}.member-main{flex:1;min-width:0}.member-main strong{font-size:13px;display:block}.member-main p{font-size:11px;color:var(--m);margin:5px 0 0}.tag{display:inline-block;font-size:10px;padding:4px 7px;border-radius:7px;background:#edf7f0;color:var(--d);margin-top:6px}.tag.pending{background:#fff3e2;color:#a8732c}.more{border:0;background:none;color:#8a958d;font-size:20px;padding:7px}.primary{height:48px;width:100%;border:0;border-radius:14px;background:var(--g);color:white;font-size:14px;font-weight:650}.hint{font-size:11px;color:#8b978e;line-height:1.8;margin:15px 2px}.toast{display:none;background:#243b2e;color:white;padding:12px;border-radius:12px;font-size:12px;margin-bottom:12px}.modal{display:none;position:fixed;inset:0;background:#14231c77;align-items:flex-end;justify-content:center;padding:14px}.modal.show{display:flex}.sheet{background:white;border-radius:22px;padding:22px;width:min(100%,400px)}.sheet h2{font-size:18px;margin:0 0 7px}.sheet p{font-size:12px;color:var(--m);line-height:1.7}.sheet button{height:44px;width:100%;border-radius:12px;margin-top:9px;border:1px solid #e0e8e1;background:white;color:var(--d)}.sheet button:last-child{background:#fff5f4;border-color:#f2e0df;color:#b85d57}
</style></head><body><main class="app">
<header class="nav"><button onclick="history.back()">‹ 返回</button><b>家庭成员</b><button onclick="location.href='family-add-member.html'">＋ 添加</button></header>
<section class="hero"><h1>一起关注家人健康</h1><p>管理家庭成员及数据查看权限。<br>示例成员不会关联真实账号。</p></section>
<div class="summary"><div><strong id="total">3</strong><span>家庭成员</span></div><div><strong id="active">2</strong><span>已加入</span></div><div><strong id="pending">1</strong><span>待接受邀请</span></div></div>
<div class="toast" id="toast" role="status"></div>
<section class="card"><div class="row"><span class="title">成员管理</span><span class="count">最多成员数以产品规则为准</span></div><div class="tabs"><button class="tab active" onclick="filterMembers('all',this)">全部</button><button class="tab" onclick="filterMembers('active',this)">已加入</button><button class="tab" onclick="filterMembers('pending',this)">待接受</button></div>
<div id="members">
<div class="member" data-status="active"><div class="avatar">👤</div><div class="member-main"><strong>我（家庭管理员）</strong><p>当前账号 · 主账号</p><span class="tag">管理员</span></div><button class="more" onclick="manage('我（家庭管理员）','管理员')">···</button></div>
<div class="member" data-status="active"><div class="avatar" style="background:#fbece5">👩</div><div class="member-main"><strong>林女士</strong><p>家庭成员 · 已加入</p><span class="tag">可查看本人记录</span></div><button class="more" onclick="manage('林女士','家庭成员')">···</button></div>
<div class="member" data-status="pending"><div class="avatar" style="background:#edf0fa">👨</div><div class="member-main"><strong>张先生</strong><p>邀请发出 · 等待对方确认</p><span class="tag pending">待接受</span></div><button class="more" onclick="manage('张先生','待接受邀请')">···</button></div>
</div></section>
<button class="primary" onclick="location.href='family-add-member.html'">＋ 添加家庭成员</button>
<p class="hint">隐私提示：家庭关系不应自动授予查看全部健康数据的权限。正式版本需由成员明确授权，并支持撤销共享。</p>
</main>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2 id="sheetTitle">成员管理</h2><p id="sheetDesc">选择要执行的操作。</p><button onclick="toast('成员权限设置页面将在后续原型中实现。');closeModal()">查看成员权限</button><button onclick="toast('已模拟查看成员详情；未读取真实账号数据。');closeModal()">查看成员详情</button><button id="removeBtn" onclick="removeMember()">移除成员</button><button onclick="closeModal()">取消</button></div></div>
<script>
let currentName='',currentStatus='';function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block'}
function filterMembers(type,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.member').forEach(m=>m.style.display=type==='all'||m.dataset.status===type?'flex':'none')}
function manage(name,status){currentName=name;currentStatus=status;document.getElementById('sheetTitle').textContent=name;document.getElementById('sheetDesc').textContent='当前身份：'+status+'。以下操作仅为原型演示。';document.getElementById('removeBtn').style.display=status==='管理员'?'none':'block';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function removeMember(){if(!confirm('确认模拟移除 '+currentName+'？'))return;const el=[...document.querySelectorAll('.member')].find(x=>x.querySelector('strong').textContent===currentName);if(el)el.remove();document.getElementById('total').textContent=document.querySelectorAll('.member').length;document.getElementById('active').textContent=document.querySelectorAll('.member[data-status="active"]').length;document.getElementById('pending').textContent=document.querySelectorAll('.member[data-status="pending"]').length;closeModal();toast('已从当前页面移除示例成员，未修改真实家庭关系。')}
</script></body></html>
