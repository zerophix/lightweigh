
<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备配对 - 轻刻健康</title>
<style>
:root{--g:#21a675;--d:#147d58;--bg:#f5f8f5;--t:#26362d;--m:#89948c}*{box-sizing:border-box}body{margin:0;background:#eaf0eb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--t)}button{font:inherit;cursor:pointer}.app{max-width:430px;min-height:100vh;background:var(--bg);margin:auto;padding:0 20px 32px}.nav{height:58px;display:flex;align-items:center;gap:20px}.back{font-size:26px;border:0;background:none}.nav b{font-size:17px}.hero{text-align:center;padding:28px 0 24px}.illustration{width:118px;height:118px;margin:auto auto 21px;border-radius:34px;background:#e0f3e7;display:grid;place-items:center;font-size:52px;position:relative}.check{position:absolute;right:-4px;bottom:-4px;width:35px;height:35px;background:var(--g);border:4px solid var(--bg);color:white;border-radius:50%;font-size:17px;display:grid;place-items:center}.hero h1{font-size:23px;margin:0 0 10px}.hero p{font-size:13px;color:var(--m);line-height:1.7;margin:0}.card{background:white;border-radius:19px;padding:18px;margin-bottom:13px}.row{display:flex;justify-content:space-between;align-items:center}.muted{color:var(--m);font-size:12px}.name{font-size:16px;font-weight:650}.deviceid{font-size:12px;color:var(--m);margin-top:7px}.line{height:1px;background:#edf1ed;margin:17px 0}.step{display:flex;gap:12px;margin:15px 0}.stepno{width:29px;height:29px;flex-shrink:0;border-radius:50%;background:#e8f6ed;color:var(--d);display:grid;place-items:center;font-weight:700;font-size:12px}.step strong{font-size:13px;display:block;margin:2px 0 5px}.step p{font-size:12px;color:var(--m);line-height:1.6;margin:0}.choice{display:flex;gap:10px;align-items:flex-start;background:#f6f9f6;padding:13px;border-radius:13px;margin-top:12px}.choice input{accent-color:var(--g);margin-top:3px}.choice strong{font-size:13px}.choice p{font-size:11px;color:var(--m);margin:5px 0 0;line-height:1.6}.primary{height:49px;width:100%;border:0;border-radius:14px;background:var(--g);color:white;font-weight:650}.secondary{height:46px;width:100%;border:1px solid #dce8df;border-radius:14px;background:white;color:var(--d);font-weight:600;margin-top:10px}.toast{display:none;background:#233b2d;color:white;border-radius:12px;padding:12px;font-size:12px;margin-bottom:12px}.progress{height:5px;border-radius:10px;background:#e8eee9;margin-top:15px;overflow:hidden}.bar{height:100%;width:0;background:var(--g);transition:width .4s}
</style></head><body><main class="app">
<header class="nav"><button class="back" onclick="history.back()">‹</button><b>设备配对</b></header>
<section class="hero"><div class="illustration">⚖<span class="check" id="check">↔</span></div><h1 id="heading">准备连接设备</h1><p id="subtitle">确认设备信息并完成配对。<br>配对流程为前端演示，不会操作真实蓝牙。</p></section>
<div class="toast" id="toast" role="status"></div>
<section class="card"><div class="row"><span class="muted">待配对设备</span><span class="muted">体脂秤</span></div><div class="name" style="margin-top:13px">轻刻智能体脂秤</div><div class="deviceid">型号：QK-Scale · 设备标识：DEMO-001</div><div class="line"></div><div class="step"><div class="stepno">1</div><div><strong>唤醒体脂秤</strong><p>将设备放置在平整坚硬的地面上，轻踩电极唤醒设备。</p></div></div><div class="step"><div class="stepno">2</div><div><strong>保持手机靠近设备</strong><p>配对时请将手机与体脂秤保持在建议距离内。</p></div></div><div class="step"><div class="stepno">3</div><div><strong>确认设备归属</strong><p>确认这是你本人或你有权管理的设备。</p></div></div></section>
<section class="card"><div style="font-size:15px;font-weight:650">设备归属</div><label class="choice"><input type="radio" name="owner" value="me" checked><span><strong>我的设备</strong><p>将此设备添加到当前账号。</p></span></label><label class="choice"><input type="radio" name="owner" value="family"><span><strong>家庭共享设备</strong><p>设备添加后，仍需按家庭成员权限管理测量数据。</p></span></label><div class="progress"><div class="bar" id="bar"></div></div></section>
<button class="primary" id="btn" onclick="startPair()">开始配对</button><button class="secondary" onclick="location.href='device-scan.html'">返回重新选择</button>
<p style="font-size:11px;color:#9aa59d;line-height:1.7;text-align:center;margin-top:16px">原型说明：此页面不会发起真实 BLE 配对、写入设备密钥或绑定后端账号。</p>
</main>
<script>
function startPair(){const b=document.getElementById('btn'),h=document.getElementById('heading'),s=document.getElementById('subtitle'),bar=document.getElementById('bar'),c=document.getElementById('check');b.disabled=true;b.textContent='正在配对…';h.textContent='正在建立连接';s.innerHTML='正在模拟设备验证流程，请稍候。';bar.style.width='35%';setTimeout(()=>bar.style.width='70%',450);setTimeout(()=>{bar.style.width='100%';h.textContent='配对演示成功';s.innerHTML='模拟配对已完成。<br>真实设备尚未连接。';c.textContent='✓';document.getElementById('toast').style.display='block';document.getElementById('toast').textContent='演示状态已更新；没有创建真实设备绑定。';b.disabled=false;b.textContent='查看设备状态';b.onclick=()=>location.href='device-connected.html'},1100)}
</script></body></html>
