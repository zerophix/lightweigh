
<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备状态 - 轻刻健康</title>
<style>
:root{--g:#21a675;--d:#147d58;--bg:#f5f8f5;--t:#26362d;--m:#89948c;--line:#edf1ed}*{box-sizing:border-box}body{margin:0;background:#eaf0eb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--t)}button{font:inherit;cursor:pointer}.app{max-width:430px;min-height:100vh;background:var(--bg);margin:auto;padding:0 20px 30px}.nav{height:58px;display:flex;align-items:center;gap:20px}.back{font-size:26px;border:0;background:none}.nav b{font-size:17px}.card{background:white;border-radius:19px;padding:18px;margin-bottom:13px}.hero{padding:17px 0 23px;text-align:center}.device-art{width:110px;height:110px;margin:0 auto 17px;border-radius:32px;background:#e4f5e9;display:grid;place-items:center;font-size:48px}.status{display:inline-flex;align-items:center;gap:6px;background:#e8f6ed;color:var(--d);padding:7px 12px;border-radius:20px;font-size:12px;font-weight:650}.dot{width:7px;height:7px;background:var(--g);border-radius:50%}.hero h1{font-size:23px;margin:12px 0 7px}.hero p{font-size:12px;color:var(--m);margin:0;line-height:1.7}.row{display:flex;align-items:center;justify-content:space-between}.title{font-size:15px;font-weight:650}.muted{font-size:12px;color:var(--m)}.device-name{font-size:16px;font-weight:700;margin-top:15px}.device-id{font-size:12px;color:var(--m);margin-top:7px}.line{height:1px;background:var(--line);margin:16px 0}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px;background:#f7faf7;border-radius:13px}.stat label{font-size:11px;color:var(--m)}.stat strong{display:block;font-size:14px;margin-top:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.primary,.secondary{height:45px;border-radius:13px;font-size:13px;font-weight:650}.primary{background:var(--g);border:0;color:white}.secondary{background:white;border:1px solid #dce8df;color:var(--d)}.wide{width:100%;margin-top:10px;height:45px;border-radius:13px;border:1px solid #eadfdf;background:#fff;color:#a45b55;font-size:13px;font-weight:600}.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.ico{width:37px;height:37px;border-radius:12px;background:#eef7f0;display:grid;place-items:center;color:var(--d)}.itemmain{flex:1}.itemmain strong{font-size:13px}.itemmain p{font-size:11px;color:var(--m);margin:5px 0 0}.arrow{color:#aab4ac}.toast{display:none;background:#243b2e;color:white;padding:12px;border-radius:12px;font-size:12px;margin-bottom:12px}
</style></head><body><main class="app">
<header class="nav"><button class="back" onclick="history.back()">‹</button><b>设备状态</b></header>
<section class="hero"><div class="device-art">⚖</div><span class="status"><i class="dot"></i><span id="statusText">已连接（演示）</span></span><h1>轻刻智能体脂秤</h1><p id="heroDesc">设备状态为模拟数据，尚未建立真实蓝牙连接。</p></section>
<div class="toast" id="toast" role="status"></div>
<section class="card"><div class="row"><span class="title">设备信息</span><span class="muted">原型演示</span></div><div class="device-name">轻刻智能体脂秤</div><div class="device-id">QK-Scale · DEMO-001</div><div class="line"></div><div class="stat-grid"><div class="stat"><label>连接状态</label><strong id="connectState">模拟已连接</strong></div><div class="stat"><label>电量状态</label><strong>正常（示例）</strong></div><div class="stat"><label>设备型号</label><strong>QK-Scale</strong></div><div class="stat"><label>最近连接</label><strong id="lastConnect">刚刚（模拟）</strong></div></div><div class="actions"><button class="primary" onclick="measure()">开始测量</button><button class="secondary" onclick="reconnect()">重新连接</button></div><button class="wide" onclick="disconnect()">断开连接</button></section>
<section class="card"><div class="title" style="margin-bottom:7px">设备管理</div><div class="item" onclick="goDetail()"><div class="ico">⚙</div><div class="itemmain"><strong>设备详情</strong><p>名称、型号、标识及管理选项</p></div><span class="arrow">›</span></div><div class="item" onclick="toast('当前为模拟设备，无法读取真实固件版本。')"><div class="ico">↻</div><div class="itemmain"><strong>固件信息</strong><p>查看设备版本（未接入）</p></div><span class="arrow">›</span></div><div class="item" onclick="toast('设备帮助页面将在后续原型批次补齐。')"><div class="ico">?</div><div class="itemmain"><strong>连接帮助</strong><p>排查连接问题</p></div><span class="arrow">›</span></div></section>
<p style="text-align:center;color:#9aa59d;font-size:11px;line-height:1.7">此页面的连接、电量和最近连接时间均为演示值，不代表真实设备状态。</p>
</main><script>
const toastBox=document.getElementById('toast');function toast(s){toastBox.textContent=s;toastBox.style.display='block'}
function disconnect(){document.getElementById('statusText').textContent='已断开（演示）';document.getElementById('connectState').textContent='模拟已断开';document.getElementById('heroDesc').textContent='当前页面状态已切换为断开演示，真实蓝牙状态未知。';toast('已切换为断开演示状态。')}
function reconnect(){document.getElementById('statusText').textContent='正在连接…';document.getElementById('connectState').textContent='连接中（模拟）';toast('正在模拟重新连接…');setTimeout(()=>{document.getElementById('statusText').textContent='已连接（演示）';document.getElementById('connectState').textContent='模拟已连接';document.getElementById('heroDesc').textContent='设备状态为模拟数据，尚未建立真实蓝牙连接。';document.getElementById('lastConnect').textContent='刚刚（模拟）';toast('演示连接流程完成；未连接真实设备。')},900)}
function measure(){toast('测量流程为演示状态；真实测量需要接入 BLE 与设备协议。')}
function goDetail(){location.href='device-detail.html'}
</script></body></html>
