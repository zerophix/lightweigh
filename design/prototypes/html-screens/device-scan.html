
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>添加设备 - 轻刻健康</title>
<style>
:root{--g:#21a675;--d:#147d58;--bg:#f5f8f5;--t:#26362d;--m:#89948c;--line:#edf1ed}*{box-sizing:border-box}body{margin:0;background:#eaf0eb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--t)}button{font:inherit;cursor:pointer}.app{max-width:430px;min-height:100vh;background:var(--bg);margin:auto;padding:0 20px 28px}.nav{height:58px;display:flex;align-items:center;gap:20px}.back{font-size:26px;border:0;background:none}.nav b{font-size:17px}.hero{text-align:center;padding:23px 0 25px}.radar{height:146px;width:146px;border-radius:50%;margin:0 auto 22px;background:radial-gradient(circle,#d9f1e3 0 19%,#e7f6ec 20% 38%,#eef8f1 39% 58%,#e4f3e9 59% 72%,transparent 73%);display:grid;place-items:center;position:relative}.radar:before,.radar:after{content:"";position:absolute;border:1px solid #8cd2ad;border-radius:50%;inset:20px;animation:pulse 2s infinite}.radar:after{inset:0;animation-delay:1s}@keyframes pulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.2);opacity:0}}.scale{width:59px;height:72px;border:3px solid var(--g);border-radius:16px;background:white;display:grid;place-items:center;font-size:24px;z-index:1}.hero h1{font-size:23px;margin:0 0 10px}.hero p{font-size:13px;color:var(--m);line-height:1.7;margin:0}.card{background:white;border-radius:19px;padding:17px;margin-bottom:13px}.row{display:flex;align-items:center;justify-content:space-between}.section{font-weight:650;font-size:15px}.small{font-size:12px;color:var(--m)}.device{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.device:last-child{border:0}.device-icon{width:48px;height:48px;border-radius:15px;background:#e8f6ed;display:grid;place-items:center;font-size:24px}.device-main{flex:1;min-width:0}.device-main strong{font-size:14px;display:block;margin-bottom:6px}.device-main small{font-size:12px;color:var(--m)}.signal{font-size:11px;color:var(--g);background:#eaf7ef;padding:5px 8px;border-radius:10px}.connect{border:0;background:var(--g);color:white;border-radius:11px;padding:10px 13px;font-size:12px;font-weight:600}.primary{height:48px;border:0;border-radius:14px;background:var(--g);color:white;width:100%;font-weight:650}.secondary{height:45px;border:1px solid #dce8df;background:white;color:var(--d);border-radius:14px;width:100%;margin-top:10px;font-weight:600}.tip{font-size:12px;line-height:1.8;color:#7e8981;padding:0 3px}.tip b{color:#53675b}.state{text-align:center;font-size:12px;color:var(--m);padding:7px}.toast{display:none;background:#233b2d;color:white;border-radius:12px;padding:12px;font-size:12px;margin-bottom:12px}
</style></head>
<body><main class="app">
<header class="nav"><button class="back" onclick="history.back()">‹</button><b>添加体脂秤</b></header>
<section class="hero"><div class="radar"><div class="scale">⌁</div></div><h1 id="heading">正在寻找附近设备</h1><p id="subtitle">请让体脂秤处于可连接状态，并靠近手机。<br>扫描结果仅为原型模拟数据。</p></section>
<div id="toast" class="toast" role="status"></div>
<section class="card"><div class="row"><span class="section">附近设备</span><span class="small" id="count">发现 2 台设备</span></div><div id="devices">
<div class="device"><div class="device-icon">⚖</div><div class="device-main"><strong>轻刻智能体脂秤</strong><small>QK-Scale · 信号良好</small></div><span class="signal">强</span><button class="connect" onclick="pair('轻刻智能体脂秤')">连接</button></div>
<div class="device"><div class="device-icon">⚖</div><div class="device-main"><strong>智能体重秤</strong><small>Scale-02 · 信号一般</small></div><span class="signal">中</span><button class="connect" onclick="pair('智能体重秤')">连接</button></div>
</div><div class="state" id="scanState">上次扫描：刚刚 · 模拟数据</div></section>
<section class="card"><div class="section" style="margin-bottom:13px">连接前检查</div><div class="tip">✓ 手机蓝牙已开启（演示状态）<br>✓ 体脂秤已唤醒并放置平稳<br>✓ 手机与设备保持在有效距离内</div></section>
<button class="primary" id="scanBtn" onclick="scan()">重新扫描</button><button class="secondary" onclick="toast('请检查系统蓝牙权限。当前页面未实际读取系统权限状态。')">蓝牙连接不上？</button>
<p class="tip" style="margin-top:16px">注意：此页面尚未接入 Android 原生 BLE 扫描。设备列表、信号强度及连接行为均为前端模拟。</p>
</main>
<script>
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block'}
function pair(name){toast('已选择“'+name+'”。正在进入配对演示页面。');setTimeout(()=>{location.href='device-pairing.html'},500)}
function scan(){const b=document.getElementById('scanBtn');b.disabled=true;b.textContent='扫描中…';document.getElementById('heading').textContent='正在扫描附近设备';document.getElementById('scanState').textContent='正在搜索（模拟）';document.getElementById('devices').style.opacity='.45';setTimeout(()=>{b.disabled=false;b.textContent='重新扫描';document.getElementById('heading').textContent='已找到附近设备';document.getElementById('scanState').textContent='扫描完成 · 模拟数据';document.getElementById('devices').style.opacity='1';document.getElementById('count').textContent='发现 2 台设备';toast('扫描演示完成。真实 BLE 扫描尚未实现。')},1200)}
</script></body></html>
