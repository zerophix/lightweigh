
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>删除记录 - 轻衡健康</title>
<style>
:root{--g:#21a675;--red:#d94b4b;--bg:#f5f8f5;--text:#202923;--muted:#87928a;--line:#e7ece8}
*{box-sizing:border-box}body{margin:0;background:#e9eeea;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--text)}
button{font:inherit;cursor:pointer}.app{max-width:430px;min-height:100vh;margin:auto;background:var(--bg)}
header{height:58px;background:white;display:flex;align-items:center;padding:0 20px;gap:15px}
header button{border:0;background:none;color:var(--muted);font-size:14px}header strong{font-size:16px}
main{padding:25px 18px}
.warning-icon{width:62px;height:62px;border-radius:21px;display:grid;place-items:center;background:#fff0ed;color:var(--red);font-size:29px;margin:12px auto 20px}
h1{text-align:center;font-size:21px;margin:0 0 10px}
.subtitle{text-align:center;color:var(--muted);font-size:12px;line-height:1.8;margin:0 auto 25px;max-width:300px}
.record{background:white;border:1px solid var(--line);border-radius:16px;padding:18px}
.record-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.status{padding:5px 8px;border-radius:15px;background:#e8f6ed;color:#147d58;font-size:10px}
.weight{font-size:32px;font-weight:700;margin:19px 0 4px}
.weight small{font-size:13px;color:var(--muted);font-weight:400}
.record p{font-size:11px;color:var(--muted);margin:0}
.metrics{display:flex;gap:23px;border-top:1px solid var(--line);margin-top:17px;padding-top:14px}
.metrics span{display:block;font-size:10px;color:var(--muted)}
.metrics strong{display:block;font-size:13px;margin-top:6px}
.warning{margin-top:16px;padding:14px;border-radius:12px;background:#fff5f2;color:#985b52;font-size:11px;line-height:1.9}
.warning strong{display:block;margin-bottom:4px;font-size:12px}
.option{margin-top:15px;padding:15px;background:white;border:1px solid var(--line);border-radius:13px;display:flex;gap:10px;align-items:flex-start}
.option input{accent-color:var(--g);margin-top:3px}
.option strong{font-size:12px}.option p{font-size:11px;line-height:1.7;color:var(--muted);margin:5px 0 0}
.actions{display:flex;gap:10px;margin-top:27px}
.actions button{height:47px;border-radius:13px;font-size:14px;font-weight:600}
.cancel{flex:1;border:1px solid var(--line);background:white}
.delete{flex:1;border:0;background:var(--red);color:white}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#25352b;color:white;padding:11px 15px;border-radius:10px;font-size:12px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
<header><button onclick="notify('返回记录详情')">‹ 返回</button><strong>删除测量记录</strong></header>
<main>
<div class="warning-icon">!</div>
<h1>确定删除这条记录？</h1>
<p class="subtitle">删除后，这条记录将不再出现在历史列表和趋势统计中。请确认你选择的是正确的记录。</p>

<section class="record">
<div class="record-head"><span>2026 年 10 月 22 日 · 08:32</span><span class="status">测量成功</span></div>
<div class="weight">62.4 <small>kg</small></div>
<p>我的档案 · 轻衡智能体脂秤</p>
<div class="metrics">
<div><span>体脂率</span><strong>21.8%</strong></div>
<div><span>BMI</span><strong>22.1</strong></div>
<div><span>肌肉量</span><strong>45.2 kg</strong></div>
</div>
</section>

<div class="warning"><strong>请注意</strong>删除可能影响相关历史趋势和报告统计。正式版本还应明确区分本地记录与云端记录的删除范围，并按产品的数据保留规则执行。</div>

<label class="option"><input type="checkbox" id="confirm"><span><strong>我已核对这条记录</strong><p>确认删除的是上方显示的测量记录。</p></span></label>
<div class="actions"><button class="cancel" onclick="notify('已取消删除')">保留记录</button><button class="delete" onclick="deleteRecord()">确认删除</button></div>
</main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
function notify(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove("show"),2200)}
function deleteRecord(){if(!document.getElementById("confirm").checked){notify("请先勾选确认项");return}notify("原型演示：删除请求已提交")}
</script>
</body>
</html>
