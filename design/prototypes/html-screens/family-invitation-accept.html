
<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭邀请 - 轻刻健康</title>
<style>
:root{--g:#21a675;--d:#147d58;--bg:#f5f8f5;--t:#26362d;--m:#89948c;--line:#edf1ed}*{box-sizing:border-box}body{margin:0;background:#eaf0eb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--t)}button{font:inherit;cursor:pointer}.app{max-width:430px;min-height:100vh;margin:auto;background:var(--bg);padding:0 20px 32px}.nav{height:58px;display:flex;align-items:center;gap:18px}.nav button{border:0;background:none;font-size:25px}.nav b{font-size:17px}.hero{text-align:center;padding:26px 0 23px}.art{width:91px;height:91px;border-radius:30px;background:#e1f4e7;display:grid;place-items:center;font-size:41px;margin:0 auto 17px}.hero h1{font-size:23px;margin:0 0 10px}.hero p{font-size:13px;line-height:1.8;color:var(--m);margin:0}.card{background:white;border-radius:18px;padding:18px;margin-bottom:13px}.title{font-size:15px;font-weight:700;margin-bottom:14px}.inviter{display:flex;align-items:center;gap:12px}.avatar{height:49px;width:49px;border-radius:16px;background:#f9e9df;display:grid;place-items:center;font-size:23px}.inviter strong{font-size:14px}.inviter p{font-size:11px;color:var(--m);margin:6px 0 0}.line{height:1px;background:var(--line);margin:16px 0}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;font-size:12px}.row span:first-child{color:#738078}.row span:last-child{text-align:right}.scope{display:flex;align-items:flex-start;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.scope:last-child{border:0}.scope-icon{width:34px;height:34px;border-radius:11px;background:#edf7f0;color:var(--d);display:grid;place-items:center;flex-shrink:0}.scope strong{font-size:13px}.scope p{font-size:11px;color:var(--m);line-height:1.7;margin:5px 0 0}.checkrow{display:flex;align-items:flex-start;gap:10px;font-size:12px;line-height:1.8;color:#68766d;margin:12px 0}.checkrow input{margin-top:4px;accent-color:var(--g)}.primary,.secondary{height:47px;width:100%;border-radius:13px;font-size:13px;font-weight:650}.primary{background:var(--g);border:0;color:white}.secondary{background:white;border:1px solid #dce8df;color:var(--d);margin-top:10px}.danger{background:white;color:#b85c56;border:1px solid #f0dddd}.notice{font-size:11px;line-height:1.8;color:#718078;margin:13px 3px}.result{display:none;text-align:center;padding:35px 0}.result h2{font-size:22px}.result p{font-size:13px;line-height:1.8;color:var(--m)}.result-icon{height:76px;width:76px;border-radius:25px;background:#e1f4e7;display:grid;place-items:center;color:var(--d);font-size:35px;margin:auto}.toast{display:none;background:#243b2e;color:white;padding:12px;border-radius:12px;font-size:12px;margin-bottom:12px}
</style></head><body><main class="app">
<header class="nav"><button onclick="history.back()">‹</button><b>家庭邀请</b></header>
<section id="invitation">
<div class="hero"><div class="art">⌂</div><h1>你收到一份家庭邀请</h1><p>加入家庭后，你可以根据自己的授权选择<br>是否与家人共享健康数据。</p></div>
<div id="toast" class="toast" role="status"></div>
<section class="card"><div class="title">邀请人信息</div><div class="inviter"><div class="avatar">👤</div><div><strong>轻刻用户（示例）</strong><p>邀请你加入家庭健康空间</p></div></div><div class="line"></div><div class="row"><span>家庭名称</span><span>温馨之家（示例）</span></div><div class="row"><span>邀请状态</span><span id="inviteStatus">待你确认</span></div><div class="row"><span>邀请有效期</span><span>以正式邀请凭证为准</span></div></section>
<section class="card"><div class="title">邀请人申请共享的数据范围</div><div class="scope"><div class="scope-icon">◉</div><div><strong>最新测量摘要</strong><p>可能包含体重和已生成的身体指标摘要。</p></div></div><div class="scope"><div class="scope-icon">▤</div><div><strong>历史测量记录</strong><p>是否共享历史记录，需要你单独明确授权。</p></div></div><div class="scope"><div class="scope-icon">✓</div><div><strong>行动计划进度</strong><p>仅涉及已授权的计划状态，不包括私人对话内容。</p></div></div><label class="checkrow"><input type="checkbox" id="understand"><span>我已了解家庭邀请的含义，并知道加入家庭不代表自动同意共享所有健康数据。</span></label><label class="checkrow"><input type="checkbox" id="shareConsent"><span>我愿意在正式服务中进一步确认数据共享范围。（本演示不创建真实授权）</span></label>
</section>
<button class="primary" onclick="accept()">接受邀请（演示）</button><button class="secondary danger" onclick="reject()">拒绝邀请</button>
<p class="notice">真实产品应验证邀请凭证的真实性、接收账号身份、有效期和一次性使用状态，并将家庭加入与健康数据授权分别记录。</p>
</section>
<section class="result" id="result"><div class="result-icon" id="resultIcon">✓</div><h2 id="resultTitle">已完成</h2><p id="resultText"></p><button class="primary" onclick="location.href='family-list.html'">查看家庭成员页面</button><button class="secondary" onclick="location.reload()">返回邀请页面</button></section>
</main><script>
function finish(title,text,icon){document.getElementById('invitation').style.display='none';document.getElementById('result').style.display='block';document.getElementById('resultTitle').textContent=title;document.getElementById('resultText').textContent=text;document.getElementById('resultIcon').textContent=icon;window.scrollTo(0,0)}
function accept(){if(!document.getElementById('understand').checked){alert('请先确认你已了解邀请和数据共享的区别。');return}const shared=document.getElementById('shareConsent').checked;finish('已接受邀请（演示）',shared?'你已在演示中确认理解共享申请。真实家庭关系和数据授权均未创建。':'你已在演示中接受家庭邀请，但没有同意共享健康数据。真实家庭关系尚未创建。','✓')}
function reject(){if(!confirm('确定拒绝这份家庭邀请吗？'))return;finish('已拒绝邀请（演示）','当前仅更新本页展示状态，不会通知邀请人，也不会修改服务端邀请记录。','×')}
</script></body></html>
