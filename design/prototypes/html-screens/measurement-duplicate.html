
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>确认测量记录 - 轻衡健康</title>
<style>
:root{--g:#20a574;--gd:#147a56;--bg:#f5f8f5;--text:#202923;--muted:#87928a;--line:#e7ece8}
*{box-sizing:border-box}
body{margin:0;background:#e9eeea;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--text)}
button{font:inherit;cursor:pointer}
.app{max-width:430px;min-height:100vh;margin:auto;background:var(--bg)}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:white}
header button{border:0;background:none;color:var(--muted);font-size:14px}
header strong{font-size:16px}
main{padding:25px 18px}
.symbol{width:58px;height:58px;margin:5px auto 18px;border-radius:19px;background:#e7f6ed;color:var(--gd);display:grid;place-items:center;font-size:28px}
h1{text-align:center;font-size:22px;margin:0 0 10px}
.intro{text-align:center;color:var(--muted);font-size:13px;line-height:1.8;margin:0 auto 25px;max-width:320px}
.card{padding:18px;background:white;border:1px solid var(--line);border-radius:17px;margin-bottom:13px}
.card-head{display:flex;justify-content:space-between;align-items:center}
.card-title{font-size:14px;font-weight:650}
.tag{font-size:11px;color:var(--gd);background:#e7f6ed;padding:6px 9px;border-radius:20px}
.time{font-size:12px;color:var(--muted);margin-top:8px}
.weight{font-size:31px;font-weight:700;margin:17px 0}
.weight small{font-size:13px;color:var(--muted);font-weight:400}
.metrics{display:flex;gap:24px;border-top:1px solid var(--line);padding-top:13px}
.metric-label{font-size:11px;color:var(--muted)}
.metric-value{font-size:14px;font-weight:650;margin-top:5px}
.recommend{padding:15px;border-radius:13px;background:#edf7f1;color:#506e5c;font-size:12px;line-height:1.8;margin-top:17px}
footer{padding:10px 18px 30px}
.primary{width:100%;height:49px;background:var(--g);color:white;border:0;border-radius:14px;font-weight:650}
.secondary{width:100%;height:46px;border:1px solid var(--line);background:white;border-radius:14px;margin-top:10px;color:var(--text)}
.tertiary{width:100%;height:42px;border:0;background:none;color:var(--gd);font-size:13px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:11px 15px;background:#25352b;color:white;border-radius:10px;font-size:13px;opacity:0;transition:.2s;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
<header><button onclick="notify('返回测量结果')">‹ 返回</button><strong>记录确认</strong><button onclick="notify('查看记录规则')">说明</button></header>
<main>
<div class="symbol">↔</div>
<h1>发现一条相近的测量记录</h1>
<p class="intro">我们发现近期有一条测量数据与本次时间接近。请核对信息后选择如何处理。</p>

<section class="card">
<div class="card-head"><div class="card-title">已有记录</div><span class="tag">已保存</span></div>
<div class="time">今天 · 08:26</div>
<div class="weight">62.7 <small>kg</small></div>
<div class="metrics">
<div><div class="metric-label">体脂率</div><div class="metric-value">22.0%</div></div>
<div><div class="metric-label">肌肉量</div><div class="metric-value">45.1 kg</div></div>
</div>
</section>

<section class="card">
<div class="card-head"><div class="card-title">本次测量</div><span class="tag">待确认</span></div>
<div class="time">今天 · 08:32</div>
<div class="weight">62.4 <small>kg</small></div>
<div class="metrics">
<div><div class="metric-label">体脂率</div><div class="metric-value">21.8%</div></div>
<div><div class="metric-label">肌肉量</div><div class="metric-value">45.2 kg</div></div>
</div>
</section>

<div class="recommend">两次测量结果存在差异，可能是正常波动。时间接近并不代表记录重复，建议核对测量时间与数据后再做决定。</div>
</main>
<footer>
<button class="primary" onclick="choose('保留两条记录')">两条都保留</button>
<button class="secondary" onclick="choose('保留本次记录')">仅保留本次记录</button>
<button class="tertiary" onclick="choose('保留已有记录')">保留已有记录</button>
</footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
function notify(msg){
const el=document.getElementById("toast");
el.textContent=msg;el.classList.add("show");
clearTimeout(window.t);
window.t=setTimeout(()=>el.classList.remove("show"),2200);
}
function choose(action){
notify("原型演示："+action+"。正式版本需要确认后执行数据变更。");
}
</script>
</body>
</html>
