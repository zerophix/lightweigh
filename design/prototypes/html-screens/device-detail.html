
<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备详情 - 轻刻健康</title>
<style>
:root{--g:#21a675;--d:#147d58;--bg:#f5f8f5;--t:#26362d;--m:#89948c;--line:#edf1ed}*{box-sizing:border-box}body{margin:0;background:#eaf0eb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--t)}button,input{font:inherit}button{cursor:pointer}.app{max-width:430px;min-height:100vh;background:var(--bg);margin:auto;padding:0 20px 34px}.nav{height:58px;display:flex;align-items:center;gap:20px}.back{font-size:26px;border:0;background:none}.nav b{font-size:17px}.hero{background:linear-gradient(145deg,#e5f5e9,#f4faf5);border-radius:22px;padding:24px 19px 22px;text-align:center;margin:8px 0 15px}.art{height:83px;width:83px;border-radius:25px;background:white;display:grid;place-items:center;font-size:38px;margin:auto auto 13px;box-shadow:0 6px 20px #246b3b0b}.hero h1{font-size:19px;margin:0 0 7px}.hero p{font-size:12px;color:#75867b;margin:0}.badge{display:inline-block;margin-top:12px;background:#d8f1e1;color:#147d58;border-radius:20px;padding:6px 10px;font-size:11px}.card{background:white;border-radius:18px;padding:17px;margin-bottom:13px}.title{font-size:15px;font-weight:700;margin-bottom:12px}.field{display:flex;justify-content:space-between;align-items:center;min-height:47px;border-bottom:1px solid var(--line);gap:15px}.field:last-child{border:0}.label{font-size:13px;color:#6e7c72}.value{font-size:13px;font-weight:550;text-align:right;overflow-wrap:anywhere}.muted{font-size:11px;color:var(--m)}.edit{border:0;background:#eaf7ee;color:var(--d);border-radius:9px;padding:6px 10px;font-size:11px}.switchrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0}.switchrow strong{display:block;font-size:13px}.switchrow p{font-size:11px;color:var(--m);margin:5px 0 0;line-height:1.5}.toggle{width:43px;height:25px;border-radius:20px;background:#dce4dd;border:0;position:relative;flex-shrink:0}.toggle:after{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;border-radius:50%;background:white;box-shadow:0 1px 3px #0002;transition:.2s}.toggle.on{background:var(--g)}.toggle.on:after{left:21px}.action{height:45px;width:100%;border-radius:13px;border:1px solid #dce8df;background:white;color:var(--d);font-weight:600;font-size:13px;margin-top:9px}.danger{border-color:#f0dddd;color:#b75b55}.toast{display:none;background:#243b2e;color:white;padding:12px;border-radius:12px;font-size:12px;margin-bottom:12px}.modal{display:none;position:fixed;inset:0;background:#17261c66;align-items:flex-end;justify-content:center;padding:15px}.modal.show{display:flex}.sheet{background:white;border-radius:22px;padding:22px;width:min(100%,400px)}.sheet h2{font-size:18px;margin:0 0 14px}.sheet input{width:100%;height:45px;border:1px solid #dce5dd;border-radius:12px;padding:0 12px;margin-bottom:12px;outline-color:var(--g)}.primary{height:46px;width:100%;border:0;border-radius:13px;background:var(--g);color:white;font-weight:650}
</style></head><body><main class="app">
<header class="nav"><button class="back" onclick="history.back()">‹</button><b>设备详情</b></header>
<section class="hero"><div class="art">⚖</div><h1 id="deviceName">轻刻智能体脂秤</h1><p>设备编号：DEMO-001</p><span class="badge">演示设备 · 非真实连接</span></section>
<div class="toast" id="toast" role="status"></div>
<section class="card"><div class="title">基本信息</div><div class="field"><span class="label">设备名称</span><span><span class="value" id="nameValue">轻刻智能体脂秤</span> <button class="edit" onclick="openRename()">修改</button></span></div><div class="field"><span class="label">设备型号</span><span class="value">QK-Scale</span></div><div class="field"><span class="label">设备标识</span><span class="value">DEMO-001</span></div><div class="field"><span class="label">固件版本</span><span class="value">未读取</span></div><div class="field"><span class="label">添加时间</span><span class="value">原型示例</span></div></section>
<section class="card"><div class="title">设备偏好</div><div class="switchrow"><div><strong>测量完成提示</strong><p>测量完成时显示提示（仅模拟设置）</p></div><button class="toggle on" aria-label="切换测量提示" onclick="toggle(this)"></button></div><div class="switchrow"><div><strong>自动同步记录</strong><p>该开关只展示界面状态，未接入云同步</p></div><button class="toggle" aria-label="切换自动同步" onclick="toggle(this)"></button></div><div class="switchrow"><div><strong>家庭共享</strong><p>设备共享关系及成员权限尚未接入</p></div><button class="toggle" aria-label="切换家庭共享" onclick="toggle(this)"></button></div></section>
<section class="card"><div class="title">设备维护</div><div class="field"><span class="label">当前状态</span><span class="value" id="status">模拟已添加</span></div><button class="action" onclick="toast('当前没有真实固件信息可供检查。')">检查固件更新</button><button class="action" onclick="toast('已模拟进入重新配对流程；请从设备扫描页面继续。')">重新配对设备</button><button class="action danger" onclick="removeDevice()">移除此设备</button></section>
<p class="muted" style="text-align:center;line-height:1.8">原型限制：修改名称仅更新当前页面内存；偏好设置不会持久化。移除设备仅切换演示状态，不会解绑真实设备或删除测量数据。</p>
</main>
<div class="modal" id="modal" onclick="if(event.target===this)closeRename()"><div class="sheet"><h2>修改设备名称</h2><input id="renameInput" maxlength="24" value="轻刻智能体脂秤" placeholder="请输入设备名称"><button class="primary" onclick="saveRename()">保存名称</button><button class="action" onclick="closeRename()">取消</button></div></div>
<script>
const toastBox=document.getElementById('toast');function toast(s){toastBox.textContent=s;toastBox.style.display='block'}
function toggle(el){el.classList.toggle('on');toast('已切换当前页面的演示设置；设置尚未保存到本地或云端。')}
function openRename(){document.getElementById('renameInput').value=document.getElementById('deviceName').textContent;document.getElementById('modal').classList.add('show')}
function closeRename(){document.getElementById('modal').classList.remove('show')}
function saveRename(){const v=document.getElementById('renameInput').value.trim();if(!v){toast('设备名称不能为空。');return}document.getElementById('deviceName').textContent=v;document.getElementById('nameValue').textContent=v;closeRename();toast('名称已在当前页面更新，刷新后不会保留。')}
function removeDevice(){if(!confirm('确定模拟移除此设备吗？此操作不会删除测量历史。'))return;document.getElementById('status').textContent='已移除（模拟）';toast('已切换为移除演示状态；未执行真实解绑。')}
</script></body></html>
