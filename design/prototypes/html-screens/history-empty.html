
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>暂无测量记录 - 轻衡健康</title>
<style>
:root{--g:#21a675;--gd:#147d58;--bg:#f5f8f5;--text:#202923;--muted:#87928a;--line:#e7ece8}
*{box-sizing:border-box}body{margin:0;background:#e9eeea;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--text)}
button{font:inherit;cursor:pointer}
.app{max-width:430px;min-height:100vh;margin:auto;background:var(--bg);display:flex;flex-direction:column}
header{height:58px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
header button{border:0;background:none;color:var(--muted);font-size:14px}header strong{font-size:16px}
main{padding:22px 18px;flex:1;display:flex;flex-direction:column}
.filters{display:flex;gap:9px;overflow:auto;margin:4px 0 0}
.chip{white-space:nowrap;padding:9px 13px;border:1px solid var(--line);border-radius:20px;background:white;color:#637067;font-size:12px}
.chip.active{border-color:#b9e4cc;background:#e8f6ed;color:var(--gd)}
.empty{margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:35px 8px}
.illustration{width:160px;height:145px;position:relative;margin-bottom:22px}
.circle{position:absolute;width:132px;height:132px;left:14px;top:7px;border-radius:50%;background:#e6f4e9}
.paper{position:absolute;width:78px;height:100px;left:42px;top:18px;border:2px solid #a5cfb2;border-radius:12px;background:#fff}
.paper:before{content:"";position:absolute;top:20px;left:14px;width:45px;height:5px;border-radius:4px;background:#dcece0;box-shadow:0 13px #dcece0,0 26px #dcece0,0 39px #dcece0}
.magnify{position:absolute;width:43px;height:43px;right:12px;bottom:6px;border:6px solid var(--g);border-radius:50%;background:#f6fcf7}
.magnify:after{content:"";position:absolute;width:23px;height:6px;background:var(--g);border-radius:5px;right:-17px;bottom:-9px;transform:rotate(45deg)}
h1{font-size:19px;margin:0 0 10px}
.desc{font-size:12px;line-height:1.9;color:var(--muted);max-width:280px;margin:0 auto}
.actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:24px}
.actions button{height:46px;border-radius:13px;font-size:13px;font-weight:600}
.primary{border:0;background:var(--g);color:white}
.secondary{border:1px solid var(--line);background:white;color:var(--text)}
.tip{background:white;border:1px solid var(--line);border-radius:15px;padding:15px;margin-top:10px}
.tip strong{font-size:12px}.tip p{font-size:11px;line-height:1.8;color:var(--muted);margin:8px 0 0}
.bottom-note{text-align:center;color:#9aa39c;font-size:10px;line-height:1.7;margin:15px 0 10px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#25352b;color:white;padding:11px 15px;border-radius:10px;font-size:12px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
<header><button onclick="notify('返回首页')">‹ 返回</button><strong>测量记录</strong><button onclick="notify('原型演示：导出记录')">导出</button></header>
<main>
<div class="filters">
<button class="chip active" onclick="selectFilter(this,'全部时间')">全部时间</button>
<button class="chip" onclick="selectFilter(this,'近 7 天')">近 7 天</button>
<button class="chip" onclick="selectFilter(this,'近 30 天')">近 30 天</button>
<button class="chip" onclick="notify('原型演示：打开日期筛选')">日期筛选⌄</button>
</div>

<section class="empty">
<div class="illustration"><div class="circle"></div><div class="paper"></div><div class="magnify"></div></div>
<h1 id="emptyTitle">还没有测量记录</h1>
<p class="desc" id="emptyDesc">完成第一次体重测量后，你的身体数据和历史变化就会显示在这里。</p>
<div class="actions">
<button class="primary" onclick="notify('原型演示：进入设备连接流程')">开始测量</button>
<button class="secondary" onclick="notify('原型演示：检查设备连接状态')">连接体脂秤</button>
</div>
</section>

<section class="tip">
<strong>让记录更有参考价值</strong>
<p>建议在相近的时间和测量条件下记录，并结合一段时间内的变化观察身体趋势。不要仅凭单次结果判断健康状况。</p>
</section>
<div class="bottom-note">轻衡健康 · 你的身体数据由你掌控</div>
</main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
function notify(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove("show"),2200)}
function selectFilter(btn,name){document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));btn.classList.add("active");document.getElementById("emptyTitle").textContent=name==="全部时间"?"还没有测量记录":"这个时间范围内没有记录";document.getElementById("emptyDesc").textContent=name==="全部时间"?"完成第一次体重测量后，你的身体数据和历史变化就会显示在这里。":"当前筛选条件下没有找到记录，可以更换时间范围或查看全部记录。"}
</script>
</body>
</html>
