
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改手机号 - 轻刻健康</title>
<style>
:root{--green:#21a675;--deep:#147d58;--bg:#f5f8f5;--text:#20332b;--muted:#7d8982;--line:#e5ece7;--red:#d95e5e;--orange:#b77b24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
.app{max-width:430px;min-height:100vh;min-height:100dvh;margin:auto;background:#fff;padding-bottom:28px}
header{height:58px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line)}
header button{border:0;background:none;font-size:27px;cursor:pointer;padding:0}
header h1{font-size:18px;margin:0}
main{padding:20px 22px}
.notice{background:#fff7e9;border:1px solid #f2e4c7;border-radius:13px;padding:13px;display:flex;gap:10px;margin-bottom:24px}
.notice .icon{color:var(--orange);font-size:19px}
.notice strong{font-size:12px}
.notice p{font-size:11px;color:#88795c;line-height:1.8;margin:5px 0 0}
.stepper{display:flex;align-items:center;margin:25px 0 27px}
.step{flex:1;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.num{width:26px;height:26px;border-radius:50%;background:#edf2ee;display:grid;place-items:center;flex-shrink:0}
.step.active{color:var(--deep);font-weight:650}
.step.active .num{background:var(--green);color:#fff}
.line{height:1px;background:var(--line);width:18px;margin:0 7px}
.field{margin-bottom:21px}
.label{display:block;font-size:12px;font-weight:650;margin-bottom:10px}
.input{height:49px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 13px}
.input:focus-within{border-color:var(--green)}
.prefix{font-size:12px;color:#64736a;white-space:nowrap}
input{width:100%;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--text)}
input::placeholder{color:#b1bbb5}
.masked{height:49px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;font-size:14px}
.badge{font-size:10px;color:var(--deep);background:#e6f7ef;padding:5px 8px;border-radius:7px}
.hint{font-size:11px;color:var(--muted);line-height:1.8;margin-top:8px}
.error{display:none;color:var(--red);font-size:11px;line-height:1.6;margin-top:7px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:11px;color:var(--muted);line-height:1.8;margin:22px 0}
.check input{width:auto;accent-color:var(--green);margin-top:4px}
.primary{width:100%;border:0;border-radius:13px;background:var(--green);color:#fff;padding:14px;font:inherit;font-size:15px;font-weight:650;cursor:pointer}
.secondary{width:100%;border:1px solid #dfe9e2;border-radius:13px;background:#fff;color:var(--deep);padding:13px;font:inherit;font-size:13px;cursor:pointer;margin-top:10px}
.result{display:none;background:#e6f7ef;border-radius:13px;padding:15px;color:var(--deep);font-size:12px;line-height:1.8;margin-top:14px}
.footer{text-align:center;font-size:10px;color:#a0aaa3;line-height:1.7;margin:24px 20px 0}
</style>
</head>
<body>
<div class="app">
<header><button onclick="history.length>1?history.back():location.href='account-security.html'" aria-label="返回">‹</button><h1>修改手机号</h1></header>
<main>
<div class="notice">
<div class="icon">!</div>
<div><strong>修改手机号会影响账号验证</strong><p>新手机号验证完成后，正式产品应更新账号绑定关系，并通知用户相关安全变更。</p></div>
</div>

<div class="stepper">
<div class="step active"><span class="num">1</span><span>填写新号码</span></div>
<div class="line"></div>
<div class="step"><span class="num">2</span><span>验证身份</span></div>
<div class="line"></div>
<div class="step"><span class="num">3</span><span>确认变更</span></div>
</div>

<form id="form">
<div class="field">
<label class="label">当前绑定手机号</label>
<div class="masked"><span id="currentPhone">138****0000</span><span class="badge">当前账号</span></div>
<p class="hint">演示号码仅用于展示。正式产品应从已认证的账号信息中读取。</p>
</div>

<div class="field">
<label class="label" for="newPhone">新的手机号</label>
<div class="input"><span class="prefix">+86</span><input id="newPhone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="请输入新的手机号" required></div>
<div class="error" id="phoneError">请输入有效的 11 位中国大陆手机号。</div>
<div class="error" id="sameError">新手机号不能与当前绑定手机号相同。</div>
</div>

<div class="field">
<label class="label" for="confirmPhone">再次确认新手机号</label>
<div class="input"><span class="prefix">+86</span><input id="confirmPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="请再次输入新手机号" required></div>
<div class="error" id="confirmError">两次输入的手机号不一致。</div>
</div>

<label class="check"><input id="consent" type="checkbox" required><span>我确认新手机号由本人使用，并了解修改后可能需要使用新号码登录或接收账号验证信息。</span></label>
<div class="error" id="consentError">请确认手机号使用声明。</div>

<button class="primary" type="submit">验证新手机号</button>
<button class="secondary" type="button" onclick="location.href='account-security.html'">取消修改</button>
</form>

<div class="result" id="result" role="status"></div>
<p class="footer">原型不会发送短信、修改账号绑定信息或触发真实安全通知。正式流程必须通过服务端完成身份校验和号码变更。</p>
</main>
</div>
<script>
const current='13800000000';
document.getElementById('currentPhone').textContent=current.slice(0,3)+'****'+current.slice(-4);
document.getElementById('form').addEventListener('submit',event=>{
 event.preventDefault();
 ['phoneError','sameError','confirmError','consentError'].forEach(id=>document.getElementById(id).style.display='none');
 const phone=document.getElementById('newPhone').value.trim();
 const confirm=document.getElementById('confirmPhone').value.trim();
 let valid=true;
 if(!/^1[3-9]\d{9}$/.test(phone)){document.getElementById('phoneError').style.display='block';valid=false}
 else if(phone===current){document.getElementById('sameError').style.display='block';valid=false}
 if(phone!==confirm){document.getElementById('confirmError').style.display='block';valid=false}
 if(!document.getElementById('consent').checked){document.getElementById('consentError').style.display='block';valid=false}
 if(!valid)return;
 const masked=phone.slice(0,3)+'****'+phone.slice(-4);
 const result=document.getElementById('result');
 result.style.display='block';
 result.innerHTML='新手机号格式校验通过：'+masked+'。<br>下一步应验证原账号身份及新手机号控制权。真实验证和绑定变更尚未接入。<br><br><button type="button" style="border:0;border-radius:9px;background:#21a675;color:#fff;padding:10px 14px;cursor:pointer" onclick="location.href=\'account-verification.html?phone='+encodeURIComponent(phone)+'&scene=change-phone\'">进入验证码原型</button>';
});
</script>
</body>
</html>
