name: Notion Sync (免费版轮询)

on:
  schedule:
    # 每 15 分钟运行一次
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '同步模式'
        required: true
        default: 'pull'
        type: choice
        options:
          - pull
          - push
          - full
      lookback_hours:
        description: '回看小时数'
        required: false
        default: '24'
      dry_run:
        description: '干运行模式'
        required: false
        default: 'false'

permissions:
  contents: write  # 需要提交 .ai/tasks.json 变更
  issues: write    # 可选：创建 Issue 通知

env:
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  NOTION_WORKSPACE_ID: ${{ secrets.NOTION_WORKSPACE_ID }}
  NOTION_DB_EPICS: ${{ secrets.NOTION_DB_EPICS }}
  NOTION_DB_FEATURES: ${{ secrets.NOTION_DB_FEATURES }}
  NOTION_DB_STORIES: ${{ secrets.NOTION_DB_STORIES }}
  NOTION_DB_DECISIONS: ${{ secrets.NOTION_DB_DECISIONS }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  sync:
    name: Notion 同步
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史用于 git 操作
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          pip install -q requests beautifulsoup4 lxml
          # 如果有 requirements.txt
          [ -f requirements.txt ] && pip install -q -r requirements.txt
      
      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: 执行同步
        id: sync
        run: |
          MODE="${{ github.event.inputs.mode || 'pull' }}"
          LOOKBACK="${{ github.event.inputs.lookback_hours || '24' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "lookback=$LOOKBACK" >> $GITHUB_OUTPUT
          
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          else
            DRY_FLAG=""
          fi
          
          bash scripts/governance/gov-notion-sync.sh $MODE \
            --lookback-hours $LOOKBACK \
            $DRY_FLAG
      
      - name: 检查变更
        id: changes
        run: |
          if git diff --quiet .ai/tasks.json .ai/tasks.layer1.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes in task files"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Task files changed"
            git diff --stat .ai/tasks.json .ai/tasks.layer1.json
          fi
      
      - name: 提交变更
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add .ai/tasks.json .ai/tasks.layer1.json
          git commit -m "sync(notion): 自动同步产品任务变更 [skip ci]"
          git push
      
      - name: 创建变更通知 Issue
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = require('child_process').execSync('git diff HEAD~1 -- .ai/tasks.json .ai/tasks.layer1.json', {encoding: 'utf8'});
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 Notion 同步更新: 产品任务变更',
              body: `## 自动同步检测到产品任务变更
            
            **触发**: 定时轮询 (每 15 分钟)
            **模式**: ${{ steps.sync.outputs.mode }}
            **回看**: ${{ steps.sync.outputs.lookback }} 小时
            
            ### 变更摘要
            \`\`\`diff
            ${diff.slice(0, 3000)}
            \`\`\`
            
            > 如有冲突请手动处理。相关任务已在 \`.ai/tasks.json\` 中标记。
            `,
              labels: ['sync', 'notion', 'auto-generated']
            });

  # 可选：定时推送状态回写（每小时一次）
  push-status:
    name: 推送任务状态回写
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装依赖
        run: pip install -q requests beautifulsoup4 lxml
      
      - name: 推送状态
        run: |
          bash scripts/governance/gov-notion-sync.sh push --all
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WORKSPACE_ID: ${{ secrets.NOTION_WORKSPACE_ID }}
          NOTION_DB_EPICS: ${{ secrets.NOTION_DB_EPICS }}
          NOTION_DB_FEATURES: ${{ secrets.NOTION_DB_FEATURES }}
          NOTION_DB_STORIES: ${{ secrets.NOTION_DB_STORIES }}
          NOTION_DB_DECISIONS: ${{ secrets.NOTION_DB_DECISIONS }}