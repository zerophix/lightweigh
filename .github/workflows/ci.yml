# 守护进 CI —— ArchUnit 分层规则从"靠自觉"变"靠门禁"
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # 全量构建：编译 + 单测 + ArchUnit 守卫（含解析自检与负例测试）
      - name: Build and test
        run: ./gradlew build --stacktrace

  docs-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install governance deps
        run: pip install --quiet pyyaml pytest
      # 文档 + 脚本 + 治理测试全量校验（GOV 规则族）
      - name: Governance validate
        run: bash scripts/governance/gov-validate.sh

  lifecycle-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 源码变更必须含 DEC + DevNotes（不可 --no-verify 绕过）
      # 对 PR: 审计 merge base 到 HEAD; 对 push: 审计 HEAD~1
      - name: Lifecycle audit
        run: |
          BASE="HEAD~1"
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          bash scripts/governance/gov-lifecycle-audit.sh --base "$BASE"
