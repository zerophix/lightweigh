# 守护进 CI —— ArchUnit 分层规则从"靠自觉"变"靠门禁"
name: ci

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
      - 'refactor/**'
      - 'test/**'
      - 'ci/**'
  pull_request:

# 特性分支上的新推送作废上一轮未跑完的 run：避免多轮并行各烧十来分钟
# （私有仓库 Actions 分钟数计量，见 DEC-033）。
# 但 master/main 例外：权威分支的每一轮都必须跑到结论，否则「刚推一个文档提交」
# 就会把上一次代码构建的结论悄悄抹掉（且表面一切正常）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

jobs:
  build-and-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要基线提交做「本次是否动了代码」的判定

      # 纯文档/治理元数据变更（docs/、*.md、mkdocs.yml、.ai/、.cache/）不触发重型
      # 构建：代码没动，上一轮构建的结论仍然成立。基线不可用（首次/强制推送）时
      # 一律按「动了代码」处理，宁可多跑一轮也不留门禁空洞。
      - name: Detect change scope
        id: scope
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "基线提交不可用，按「动了代码」保守处理"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-only "$BASE" HEAD)
          echo "本次变更文件:"
          echo "$FILES" | sed 's/^/  /'
          if echo "$FILES" | grep -qvE '^(docs/|\.ai/|\.cache/|mkdocs\.yml$|.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "仅文档/治理元数据变更，跳过重型构建；本 job 仍上报成功，分支保护不受影响"
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # 「构建缓存是否跨轮存活」是 DEC-033 的核心假设，用日志钉住而不是靠猜：
      # gradlew 把 GRADLE_USER_HOME 固定在项目内 .gradle-user，故缓存也落在那里
      - name: Report build cache state
        if: steps.scope.outputs.code == 'true'
        run: |
          CACHE="${GRADLE_USER_HOME:-$PWD/.gradle-user}/caches/build-cache-1"
          echo "构建缓存目录: $CACHE"
          if [ -d "$CACHE" ]; then
            echo "条目数: $(find "$CACHE" -maxdepth 1 -type f | wc -l)  大小: $(du -sh "$CACHE" | cut -f1)"
          else
            echo "目录不存在 —— 本轮无缓存可取（首轮，或未持久化）"
          fi

      # 全量构建：编译 + 单测 + ArchUnit 守卫（含解析自检与负例测试）
      - name: Build and test
        if: steps.scope.outputs.code == 'true'
        run: ./gradlew build --stacktrace

      # androidTest 源集纳入编译门（T-005 迁移测试已落地并在模拟器实跑通过）
      - name: Compile androidTest
        if: steps.scope.outputs.code == 'true'
        run: ./gradlew assembleAndroidTest --stacktrace

  docs-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install governance deps
        run: pip install --quiet pyyaml pytest
      # 文档 + 脚本 + 治理测试全量校验（GOV 规则族）
      - name: Governance validate
        run: bash scripts/governance/gov-validate.sh

  lifecycle-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 源码变更必须含 DEC + DevNotes（不可 --no-verify 绕过）
      # 对 PR: 审计 merge base 到 HEAD; 对 push: 审计 HEAD~1
      - name: Lifecycle audit
        run: |
          BASE="HEAD~1"
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          bash scripts/governance/gov-lifecycle-audit.sh --base "$BASE"

  # DEC-052: 黄金向量 / Room schema 变更须 DEC 或显式放行
  schema-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Schema / golden guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash scripts/governance/gov-schema-guard.sh --ci --base "${{ github.event.pull_request.base.sha }}"
