# Conda 环境配置 — MkDocs 文档站点
#
# 用法:
#   conda env create -f environment.yml
#   conda activate mkdocs
#   mkdocs serve       # 本地预览
#   mkdocs build       # 构建站点
#
# 自动激活:
#   如果使用 conda，在 .bashrc/.zshrc 添加:
#   conda activate mkdocs 2>/dev/null || true

name: mkdocs
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - pip
  - pip:
    - mkdocs>=1.6.0
    - mkdocs-material>=9.5.0
    - mkdocs-awesome-pages-plugin>=2.9.0
    - mkdocs-git-revision-date-localized-plugin>=1.2.0
