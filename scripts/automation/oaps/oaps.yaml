# OAPS Configuration
coordinator:
  max_concurrent: 2
  check_interval: 45

resources:
  max_workers: 2
  daily_token_budget: 5000000
  worker_token_limit: 1000000

# Per-session supervisor (the "keep going" brain)
supervisor:
  poll_interval: 8
  token_warn: 140000
  token_critical: 175000
  idle_ms_warn: 90000
  max_rounds: 60
  max_no_progress: 5
  dod_every: 3
  max_wallclock_s: 2700

monitoring:
  web_ui_port: 8080
